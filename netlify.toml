[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Every page is pre-rendered to its own HTML file (scripts/prerender.mjs), so
# there is no SPA catch-all. Unknown URLs fall through to dist/404.html, which
# Netlify serves with a real 404 status.

[images]
  remote_images = ["https://storage\\.googleapis\\.com/crown_money/.*"]

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
